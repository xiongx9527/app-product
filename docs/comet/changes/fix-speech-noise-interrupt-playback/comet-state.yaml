      的歌」这类中英混排与英文正常短指令不受影响。
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: 播报 / 思考期间插话能按现有约定排队；喊「小熊小熊」能跳过当前句并继续队列。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: 界面显示有排队句时，队列会继续被消费（播完一句接下一句），不再出现永久卡住。
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: 点歌不再出现非预期来源导致的「播放失败，可换个风格或检查网络」；确因上游失败时提示如实反映。
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: 竖屏播放条：标题横排完整显示、控制按钮排列整齐不互相挤压；横屏同样正常。
    result: pending
    reason: null
builder_handoff:
  candidate_id: fix-speech-noise-interrupt-playback:3
  identity_provider: skill-coordinated
  builder_execution_ref: main-fix-speech-noise-20261116
  iteration: 1
  summary:
    text: 五类问题全部实现修复：①A1 英文碎片——noiseFilter EN_FILLER_WORDS
      扩充代词/系动词/介词等高频虚词（she/he/it/is 等用户实测词全覆盖），保持「整段纯拉丁虚词 ≤3
      词」边界，中英混排与英文短指令不误伤；②A2+A3 打断困难与队列卡死——根因为客户端 tts.end 后依赖 App 端 AudioTrack
      idle 回调发 playback_done，回调链丢失时网关每句白等 30s 超时，观感即「排队不处理、打断无响应」；新增 12s
      播完回执兜底（onPlaybackSettled 统一收尾，idle 与兜底共用、幂等），队列持续推进；③用户新增需求「插话识别显示出来」——网关
      asr.partial 放行忙时插话草稿（回声草稿仍用 resemblesSpoken 抑制），客户端 asr.partial/asr.queued
      在思考/播报/排队中同步显示插话原文到草稿区，与「正在思考/正在播放」并存（phase 不被顶掉）；④A5 竖屏播放条——music-row 加
      flex-wrap、music-info 改 flex:1 1 220px，竖屏标题保 220px、按钮区换行，横屏单行不变；⑤A4
      播放失败——music.error 提示如实保留；B站 mp4 durl 修复已在前一批装机（评书/B站兜底可播性根因已除），本 change
      真机复现验证 A4。
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
