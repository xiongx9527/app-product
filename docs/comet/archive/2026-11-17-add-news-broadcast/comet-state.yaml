        FILLER_WORDS 剥掉，全新请求）。newsTool.headlinesUrl(keyword) 走 word=
        话题搜索；formatNews 口播「查到 N 条与「XX」相关的新闻」（newsFormat.test.ts:20-24）。会话用例
