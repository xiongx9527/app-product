        词」拦截边界；gateway 单测新增 category 用例并全过（513 tests）。代码+单测证据确凿。
      truncated: false
  - id: A2
    source: brief.md
    text: 播报 / 思考期间插话能按现有约定排队；喊「小熊小熊」能跳过当前句并继续队列。
    result: passed
    reason:
      text: 验收针对机制：voiceSessionService 已实现插话按约定入队、session.skip_current
        跳过当前句并继续消费队列，单测覆盖；客户端 asr.partial/asr.queued 在思考/播报/排队中显示插话原文。注：播报期 ASR
        识别准确率（「小熊小熊」被识别成「有有」）不属于本项机制验收，用户已决定另开 change 用 9529 流式 ASR 处理，见 risks。
      truncated: false
