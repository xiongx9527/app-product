# model-proxy 容器编排。
# 默认：model-proxy + redis（缓存/限流）+ mysql（纠错词库），三者一起起。
# 用法（在 model-proxy 目录）：
#   docker compose up -d                    # 起 model-proxy + redis + mysql（默认）
#   docker compose down                     # 停止（数据卷保留，不丢）
#   docker compose --profile pgsql up -d    # 额外带 pgsql（可选，纠错库可切 postgres）
#
# 回退 sqlite（不要 redis/mysql）：用环境变量覆盖，并把 redis/mysql 服务去掉：
#   CORRECTION_DB=sqlite RATE_LIMIT_BACKEND=memory docker compose up -d
#   或编辑本文件把 model-proxy.environment 里 REDIS_URL / VOICE_MYSQL_DSN 注释掉。

services:
  model-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-product/model-proxy:local
    container_name: model-proxy
    restart: unless-stopped
    # 容器日志轮转：json-file 单文件上限 10MB、最多保留 20 个归档，防止日志撑爆磁盘。
    # 与概览页 LOG_ROTATE_MAX_MB / LOG_ROTATE_MAX_FILES 展示口径一致。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "20"
    # 容器加固：丢弃全部 Linux capability、禁止提权、根文件系统只读（仅 /data 卷可写）。
    # 注意：业务需写 /tmp（ffmpeg/推理临时文件），用 tmpfs 提供可写内存盘。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "19529:19529"
    environment:
      VOICE_HOME: /data
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: "19529"
      # 容器身份信息（供管理面板概览页展示；hostname 自动给出容器 ID 前 12 位）
      CONTAINER_NAME: model-proxy
      IMAGE_NAME: app-product/model-proxy:local
      # 可选：不挂 docker.sock 时可手动指定 Docker 版本；留空则经 sock 自动读取
      DOCKER_VERSION: ${DOCKER_VERSION:-}
      # 缓存/限流走 Redis（连不上自动降级到内存）：
      REDIS_URL: redis://redis:6379/0
      # 纠错词表缓存：redis(走 Redis) | memory(不走缓存)，默认跟随 REDIS_URL
      CORRECTION_CACHE: ${CORRECTION_CACHE:-redis}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      # 纠错词库走 MySQL（VOICE_MYSQL_DSN 的 mysql:// scheme 会被自动推断为 mysql 后端）；
      # 也可用 VOICE_CORRECTION_DB 显式指定，值：sqlite|mysql|postgresql。
      VOICE_CORRECTION_DB: ${CORRECTION_DB:-mysql}
      VOICE_MYSQL_DSN: mysql://voice:${MYSQL_PASSWORD:-voice_pass}@mysql:3306/voice
      # 可选 PostgreSQL（把 CORRECTION_DB=postgresql 时生效）：
      # VOICE_REMOTE_DSN: postgresql://voice:${PG_PASSWORD:-voice_pass}@pgsql:5432/voice
      # 鉴权开关：需要 API-Key 时设 on（api-key 文件随 /data 挂载）：
      # VOICE_API_KEY_AUTH: "on"
      # 模型/框架缓存写到可写的 /data（根文件系统只读，默认 /root/.cache 写不了）。
      # PaddleOCR 初始化会经 transformers 写 huggingface 缓存，不设会导致 OCR 500。
      HF_HOME: /data/.cache/huggingface
      HF_HUB_CACHE: /data/.cache/huggingface/hub
      # 容器内 PaddleOCR 需 AVX2（Docker VM 只有 AVX，会 SIGILL），改用 onnxruntime 版内置 OCR。
      # rapidocr_onnxruntime 及依赖装在可写目录 OCR_LIB_DIR，避免只读根无法写缓存。
      OCR_ENGINE: rapidocr
      OCR_LIB_DIR: /data/.pylibs
    volumes:
      # 源码挂载：代码改动后只需 restart 容器即可生效，无需重建镜像重下 torch 等大依赖。
      - ./voice:/app/voice:ro
      # 宿主运行目录整体挂进容器：voice.conf / voice.db / models / api-key / 日志。
      - ${VOICE_HOME:-$HOME/.app-product/voice}:/data
      # 内置重排模型（BAAI/bge-reranker-v2-m3，约 2.1G）：只读挂进容器，
      # builtin_rerank.py 的默认候选路径含 /data/models/bge-reranker-v2-m3。
      - ${RERANK_MODEL:-$HOME/Workspace/Soft/models/bge-reranker-v2-m3}:/data/models/bge-reranker-v2-m3:ro
      # 内置 OCR 模型（PP-OCRv5）+ 可写缓存：PaddleOCR 默认读 ~/.paddlex/official_models，
      # 并往该目录写缓存/锁文件，故挂载为可写（根文件系统只读，不挂会 OSError）。
      - ${PADDLEX_HOME:-$HOME/.paddlex}:/root/.paddlex
      # 只读挂载 docker.sock：让概览页能自动读到宿主机 Docker 引擎版本（无写权限）。
      # 若出于安全不想挂载，可删掉此行，改用环境变量 DOCKER_VERSION 手动注入版本号。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy

  # ── Redis（缓存 + 限流令牌桶）────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: model-proxy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # 不映射宿主端口，容器间走服务名 redis:6379；宿主调试可加 ports: ["6379:6379"]。

  # ── MySQL（纠错词库）──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: model-proxy-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voice_root_pass}
      MYSQL_DATABASE: voice
      MYSQL_USER: voice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voice_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用 127.0.0.1 强制走 TCP（localhost 走 socket 会在用户/权限初始化完成前假阳性），
      # 并以 voice 用户认证，确保 model-proxy 起来时 mysql 真正可连。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uvoice -p${MYSQL_PASSWORD:-voice_pass} 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── 可选：PostgreSQL（纠错词库可切 postgres）──────────────────────
  pgsql:
    image: postgres:16-alpine
    container_name: model-proxy-pgsql
    restart: unless-stopped
    profiles: ["pgsql"]
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${PG_PASSWORD:-voice_pass}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 10s
      retries: 5

volumes:
  redis-data:
  mysql-data:
  pgsql-data:
